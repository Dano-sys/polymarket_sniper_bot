app = "polymarket-sniper-bot"
primary_region = "arn"

[build]
  dockerfile = "Dockerfile"

[deploy]
  wait_timeout = "10m"

[env]
  PORT = "8080"
  DATA_DIR = "/data"
  SNIPER_DATA_DIR = "/data"
  DRY_RUN = "true"
  DRY_RUN_RESET_ON_START = "false"
  DASHBOARD_HOST = "0.0.0.0"

[mounts]
  source = "polymarket_sniper_data"
  destination = "/data"
  initial_size = "1gb"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]
